<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starry Night Pixel Animation (p5.js)</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      color: #d9def1;
      font-family: Inter, system-ui, sans-serif;
    }

    main {
      display: grid;
      gap: 0.75rem;
      justify-items: center;
      padding: 1rem;
    }

    canvas {
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      max-width: 96vw;
      height: auto;
    }
  </style>
</head>
<body>
  <main>
    <h1>Vincent van Gogh — The Starry Night (Animated Pixels)</h1>
    <p>Base image + subtle vortex flow field + star pulsing. No particles, no random.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
